{% comment %} Seminar list; edit entries in _data/seminars.yml {% endcomment %}
{% include base_path %}
<div class="seminar-list">
  {% for talk in site.data.seminars %}
    <div class="seminar-item">
      <div class="seminar-item__head">
        <strong class="seminar-item__title">[{{ forloop.rindex }}] {{ talk.title }}</strong>
        <span class="seminar-item__date">{{ talk.date }}</span>
      </div>
      {% if talk.slides and talk.slides != "" %}
        <a href="{% if talk.slides contains '://' %}{{ talk.slides }}{% else %}{{ base_path }}{{ talk.slides }}{% endif %}">[Slides]</a>
      {% endif %}
    </div>
  {% endfor %}
</div>
